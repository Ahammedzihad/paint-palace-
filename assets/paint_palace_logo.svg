<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C068" />
      <stop offset="25%" stop-color="#FBF3D5" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#AA7C11" />
      <stop offset="100%" stop-color="#F3DC82" />
    </linearGradient>
    
    <!-- Chrome Silver Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="35%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Deep Navy Background Gradient -->
    <radialGradient id="navyDisc" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#112948" />
      <stop offset="70%" stop-color="#0a1d33" />
      <stop offset="100%" stop-color="#051221" />
    </radialGradient>

    <!-- Shadow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Outer Double Gold Ring -->
  <circle cx="150" cy="150" r="144" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" />
  <circle cx="150" cy="150" r="138" fill="url(#navyDisc)" stroke="url(#goldGrad)" stroke-width="1.8" />
  <circle cx="150" cy="150" r="130" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="3,2" opacity="0.6" />

  <!-- House Graphic with Garage & Car -->
  <g transform="translate(150, 68)" text-anchor="middle" filter="url(#glow)">
    <!-- Roof with Chimney -->
    <polygon points="0,-32 -42,2 42,2" fill="none" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linejoin="round" />
    <!-- Chimney -->
    <rect x="22" y="-22" width="7" height="12" fill="url(#goldGrad)" />
    <!-- Attic window / emblem -->
    <circle cx="0" cy="-10" r="5" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" />
    <circle cx="0" cy="-10" r="2" fill="url(#goldGrad)" />
    
    <!-- House pillars / Garage walls -->
    <rect x="-34" y="2" width="4" height="24" fill="url(#goldGrad)" />
    <rect x="30" y="2" width="4" height="24" fill="url(#goldGrad)" />
    <line x1="-36" y1="2" x2="36" y2="2" stroke="url(#goldGrad)" stroke-width="2.5" />

    <!-- Car Silhouette (Automotive Paint representation) -->
    <g transform="translate(0, 15)">
      <!-- Car windshield / roof -->
      <path d="M -15,0 L -9,-8 L 9,-8 L 15,0 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2" />
      <!-- Car body -->
      <path d="M -22,1 Q -24,4 -22,8 L 22,8 Q 24,4 22,1 Q 16,0 12,0 L -12,0 Q -16,0 -22,1 Z" fill="url(#goldGrad)" />
      <!-- Car headlights -->
      <circle cx="-16" cy="4" r="2.2" fill="#FFFFFF" />
      <circle cx="16" cy="4" r="2.2" fill="#FFFFFF" />
      <!-- Grille -->
      <line x1="-7" y1="5" x2="7" y2="5" stroke="#0a1d33" stroke-width="1.5" />
      <line x1="-6" y1="7" x2="6" y2="7" stroke="#0a1d33" stroke-width="1.2" />
    </g>
  </g>

  <!-- Monogram PP with Paint Drips -->
  <g id="letters-pp" filter="url(#glow)">
    <!-- First 'P' - Gold with drips -->
    <g transform="translate(94, 126)">
      <!-- Main stem of P -->
      <rect x="0" y="0" width="13.5" height="42" fill="url(#goldGrad)" rx="1.5" />
      <!-- Loop of P -->
      <path d="M 12,0 C 33,-1 33,26 12,26 L 12,17 C 22,17 22,9 12,9 Z" fill="url(#goldGrad)" />
      <!-- Dripping Paint from bottom stem -->
      <path d="M 0,42 Q 2,49 4,49 Q 6,42 7,42" fill="url(#goldGrad)" />
      <path d="M 6.5,42 Q 9,56 11,56 Q 13.5,42 13.5,42" fill="url(#goldGrad)" />
      <!-- Detached tiny drip -->
      <circle cx="10" cy="62" r="1.8" fill="url(#goldGrad)" />
    </g>

    <!-- Second 'P' - Silver / Chrome with drips -->
    <g transform="translate(152, 126)">
      <!-- Main stem of P -->
      <rect x="0" y="0" width="13.5" height="42" fill="url(#silverGrad)" rx="1.5" />
      <!-- Loop of P -->
      <path d="M 12,0 C 33,-1 33,26 12,26 L 12,17 C 22,17 22,9 12,9 Z" fill="url(#silverGrad)" />
      <!-- Dripping Paint from bottom stem -->
      <path d="M 0,42 Q 2.5,54 5,54 Q 7.5,42 8,42" fill="url(#silverGrad)" />
      <path d="M 7,42 Q 10,48 12,48 Q 13.5,42 13.5,42" fill="url(#silverGrad)" />
      <!-- Detached tiny drip -->
      <circle cx="3.8" cy="60" r="1.8" fill="url(#silverGrad)" />
    </g>
  </g>

  <!-- Decorative separator line -->
  <g transform="translate(150, 204)">
    <line x1="-70" y1="0" x2="70" y2="0" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.8" />
    <circle cx="0" cy="0" r="2.5" fill="url(#goldGrad)" />
  </g>

  <!-- Tagline underneath PP -->
  <text x="150" y="218" font-family="'Inter', 'Montserrat', sans-serif" font-size="8.5" font-weight="700" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1.8">
    HOME PAINT &amp; AUTO PAINT
  </text>

  <!-- Arc text for PAINT PALACE along bottom curve -->
  <path id="curvePath" d="M 46,215 A 118,118 0 0,0 254,215" fill="none" />
  <text font-family="'Montserrat', 'Cinzel', 'Trajan Pro', sans-serif" font-size="16" font-weight="900" fill="url(#goldGrad)" letter-spacing="3.5">
    <textPath href="#curvePath" startOffset="50%" text-anchor="middle">
      PAINT PALACE
    </textPath>
  </text>
</svg>
